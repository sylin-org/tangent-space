# One Tangent Space in a container on 5220, reachable from this machine only, its data folder in the `state`
# volume (docker compose up -d). It needs no address to start: until it has one it answers at the address each request
# arrives on, the sign-in that sets it up makes that address its own, and an https address it is reached at later is
# offered to its operator. Behind a reverse proxy on this machine, TANGENT_PROXY names the proxy as the container sees
# it, the compose network's gateway, so its forwarded scheme and host are believed; TANGENT_URL names the address
# instead, which then wins. Back up while it runs, then copy the backup out:
#   docker compose exec tangent /app/Tangent.Server backup /state/backups
#   docker compose cp tangent:/state/backups ./backups
# Restore while it is stopped (--replace moves the current data folder aside inside the volume):
#   docker compose stop tangent
#   docker compose run --rm tangent restore /state/backups/<backup> --replace
name: tangent-space
services:
  tangent:
    build:
      context: .
    ports:
      - "127.0.0.1:5220:5220"
    environment:
      # Empty unless TANGENT_URL or TANGENT_PROXY is set, and an empty value configures nothing. A configured address
      # is https: in Production atproto sign-in has no http client.
      Koan__Web__ApplicationUrl: "${TANGENT_URL:-}"
      Koan__Web__TrustedProxies__0: "${TANGENT_PROXY:-}"
      Tangent__DataFolder: "/state/data"
    volumes:
      - state:/state
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  state:
