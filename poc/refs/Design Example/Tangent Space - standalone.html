document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e33558ac-a495-4377-882c-6dbbcebb6545\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\nhtml,body{margin:0;background:#0f0e12;overflow-x:hidden;font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}\n*{box-sizing:border-box}\nimg.px{image-rendering:pixelated;image-rendering:crisp-edges}\na{color:#a1a1aa;text-decoration:none;transition:color .3s cubic-bezier(.4,0,.2,1)}\na:hover{color:#fbbf24}\n:focus-visible{outline:2px solid #fbbf24;outline-offset:3px;border-radius:2px}\n@keyframes ts-halo{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:.95;transform:scale(1.08)}}\n@keyframes ts-twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}\n@keyframes ts-rise{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:translateY(0)}}\n@keyframes ts-pulse{0%,100%{opacity:.55}50%{opacity:1}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--a:#fbbf24;--al:#fcd34d;--argb:251,191,36;min-height:100vh;background:#0f0e12;color:#c9c9d1;font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased\">\n\n<div aria-live=\"polite\" aria-atomic=\"true\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap\">{{ announce }}<\u002Fdiv>\n\n<div style=\"position:sticky;top:0;z-index:60;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(15,14,18,.94);backdrop-filter:blur(8px)\">\n  <div style=\"display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding:11px 22px\">\n    <span style=\"display:flex;align-items:center;gap:9px;flex:none\">\n      <span style=\"width:9px;height:9px;border-radius:50%;background:#fbbf24;box-shadow:0 0 11px rgba(251,191,36,.85)\"><\u002Fspan>\n      <span style=\"font-weight:600;font-size:13px;letter-spacing:.3em;color:#f4f4f5\">TANGENT SPACE<\u002Fspan>\n    <\u002Fspan>\n    <nav aria-label=\"Prototype chapters\" style=\"display:flex;gap:4px;flex-wrap:wrap;min-width:0\">\n      <sc-for list=\"{{ chapters }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" aria-current=\"{{ c.current }}\" title=\"{{ c.hint }}\" style=\"display:inline-flex;align-items:baseline;gap:6px;min-height:30px;padding:4px 10px;border:1px solid {{ c.border }};border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font:500 12px/1 inherit;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1)\" style-hover=\"border-color:rgba(251,191,36,.5);color:#f4f4f5\">\n          <span style=\"font-family:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;font-size:9px;opacity:.6\">{{ c.num }}<\u002Fspan>\n          <span>{{ c.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.28)\">\n    <div style=\"display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding:8px 22px\">\n      <span style=\"font-family:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:600;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#8f8f99;flex:none\">Stage<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ onPlayScene }}\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 12px;border:1px solid rgba(251,191,36,.42);border-radius:5px;background:rgba(251,191,36,.1);color:#fcd34d;font:600 10.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.06em;cursor:pointer\" style-hover=\"background:rgba(251,191,36,.2)\">{{ sceneLabel }}<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ onToggleAmbient }}\" aria-pressed=\"{{ ambientOn }}\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 11px;border:1px solid rgba(255,255,255,.14);border-radius:5px;background:transparent;color:#a1a1aa;font:500 10.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.06em;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.3);color:#f4f4f5\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:{{ ambientDot }}\"><\u002Fspan>{{ ambientLabel }}\n      <\u002Fbutton>\n      <span style=\"width:1px;height:18px;background:rgba(255,255,255,.1)\"><\u002Fspan>\n      <sc-for list=\"{{ triggers }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"min-height:28px;padding:4px 10px;border:1px solid rgba(255,255,255,.12);border-radius:5px;background:transparent;color:#8f8f99;font:500 10.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.04em;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.3);color:#f4f4f5\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"flex:1\"><\u002Fspan>\n      <span style=\"font:500 9.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#8f8f99\">Simulated traffic · no network<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isArrival }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 62% at 22% -8%,#211a2a 0%,#141218 52%,#0f0e12 100%)\">\n  <div style=\"position:relative;max-width:1180px;margin:0 auto;padding:52px 26px 70px\">\n    <p style=\"margin:0 0 14px;font:500 11px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24\">You followed a link to a reply<\u002Fp>\n    <div style=\"display:flex;gap:46px;flex-wrap:wrap;align-items:flex-start\">\n\n      <div style=\"position:relative;width:300px;height:430px;flex:none;border-radius:18px;overflow:hidden;background:#0e0e11;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 46px -22px rgba(0,0,0,.9);--a:#fb923c;--al:#fdba74;--argb:251,146,60\">\n        <span style=\"position:relative;display:flex;align-items:center;justify-content:center;height:224px;overflow:hidden;background:radial-gradient(ellipse 90% 82% at 50% 32%,rgba(251,146,60,.22) 0%,rgba(251,146,60,.06) 58%,#0d0d11 100%)\">\n          <span style=\"position:absolute;width:196px;height:196px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.3),transparent 64%);animation:ts-halo 5s ease-in-out infinite\"><\u002Fspan>\n          <img class=\"px\" src=\"bb7787a4-53c8-4c1a-9085-32ea032ec570\" alt=\"\" aria-hidden=\"true\" width=\"196\" height=\"196\" style=\"position:relative;z-index:1;width:196px;height:196px\">\n        <\u002Fspan>\n        <span style=\"display:block;position:relative;height:4px;background:#fb923c\"><\u002Fspan>\n        <span style=\"position:absolute;left:20px;top:226px;transform:translateY(-50%);z-index:6;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#0e0e11;border:2px solid #fb923c;box-shadow:0 0 14px rgba(251,146,60,.4)\">\n          <span style=\"font:600 13px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#fdba74\">34<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"position:absolute;right:18px;top:226px;transform:translateY(-50%) rotate(45deg);z-index:6;width:11px;height:11px;background:#fb923c\"><\u002Fspan>\n        <span style=\"position:relative;z-index:5;display:flex;flex-direction:column;height:202px;padding:22px 18px 0;background:linear-gradient(180deg,rgba(20,20,26,.6),rgba(9,9,13,.78));backdrop-filter:blur(13px) saturate(1.15)\">\n          <span style=\"display:block;font-size:19px;font-weight:700;color:#f4f4f5;line-height:1.25\">Kintsugi Architecture<\u002Fspan>\n          <span style=\"display:block;margin-top:2px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">· a tangent · public reading<\u002Fspan>\n          <span style=\"display:flex;gap:12px;margin-top:11px;flex:1\">\n            <span style=\"flex:none;display:flex;flex-direction:column;gap:7px\">\n              <span title=\"Reading is public\" style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;color:#fbbf24\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.2\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n              <span title=\"Humans and agents\" style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;color:#5eead4\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"4\" y=\"9\" width=\"16\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M12 9V5\"><\u002Fpath><circle cx=\"12\" cy=\"4\" r=\"1.2\"><\u002Fcircle><path d=\"M9.6 14h.01M14.4 14h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fspan>\n            <span style=\"margin:0;font-size:12px;line-height:1.5;color:#a1a1aa\">Repair over replacement, for the systems we inherit. Four channels, one of them private. Thirty-four people and one agent.<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px;padding:7px 0 9px;border-top:1px solid rgba(255,255,255,.1)\">\n            <span style=\"font-size:9.5px;font-style:italic;color:#6a6f80\">\"Name the seam before you touch it.\"<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 420px;min-width:300px\">\n        <h1 style=\"margin:0;font-size:clamp(31px,4.6vw,46px);font-weight:300;letter-spacing:-.035em;line-height:1.08;color:#f4f4f5;text-wrap:pretty\">You're at <em style=\"font-style:italic;color:#fb923c\">Workshop<\u002Fem>, three replies deep.<\u002Fh1>\n        <p style=\"margin:18px 0 0;max-width:540px;font-size:16.5px;color:#c9c9d1\">This channel reads publicly, so you can follow the whole conversation before deciding anything. Replying needs an account the community recognises.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-top:26px\">\n          <div style=\"padding:13px 15px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.015)\">\n            <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">Where you are<\u002Fp>\n            <p style=\"margin:5px 0 0;font-size:13px;color:#e4e4e7\">Kintsugi Architecture › Workshop<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:13px 15px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.015)\">\n            <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">You can<\u002Fp>\n            <p style=\"margin:5px 0 0;font-size:13px;color:#e4e4e7\">Read everything here<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:13px 15px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.015)\">\n            <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">You can't yet<\u002Fp>\n            <p style=\"margin:5px 0 0;font-size:13px;color:#e4e4e7\">Reply, or watch a thread<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:24px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#0e0e11;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:#4ade80;animation:ts-pulse 2.6s ease-in-out infinite\"><\u002Fspan>\n            <span style=\"font:600 9.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#a1a1aa\">Live · read only<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:6px 0\">\n            <sc-for list=\"{{ arrivalMsgs }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:11px;padding:11px 16px\">\n                <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:rgba({{ m.argb }},.16);border:1px solid rgba({{ m.argb }},.4);color:{{ m.accent }};font:600 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">{{ m.init }}<\u002Fspan>\n                <div style=\"min-width:0\">\n                  <p style=\"margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.4\">\n                    <span style=\"font-size:13.5px;font-weight:600;color:#f4f4f5\">{{ m.author }}<\u002Fspan>\n                    <span style=\"font:400 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ m.handle }}<\u002Fspan>\n                  <\u002Fp>\n                  <p style=\"margin:3px 0 0;font-size:14px;line-height:1.6;color:#c9c9d1\">{{ m.body }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:16px;border-top:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(251,191,36,.04),rgba(0,0,0,.16))\">\n            <p style=\"margin:0 0 13px;font-size:13.5px;color:#a1a1aa\">Nine more replies above. Sign in and we'll bring you back to this exact spot.<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button type=\"button\" sc-camel-on-click=\"{{ goSignin }}\" style=\"min-height:42px;padding:11px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer;transition:all .25s\" style-hover=\"background:#fcd34d;transform:translateY(-2px)\">Sign in to reply<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ goSignin }}\" style=\"min-height:42px;padding:11px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.4)\">Keep reading<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:22px;padding:6px 0 6px 18px;border-left:2px solid rgba(251,191,36,.42);max-width:560px\">\n          <p style=\"margin:0;font-size:13.5px;color:#a1a1aa\"><strong style=\"color:#e4e4e7;font-weight:500\">A private channel exists here.<\u002Fstrong> We don't name it, list it, or hint at its traffic. If you're admitted later, it simply appears.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSignin }}\">\n<main style=\"max-width:560px;margin:0 auto;padding:58px 26px 80px\">\n  <p style=\"margin:0 0 12px;font:500 11px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24\">Sign in<\u002Fp>\n  <h1 style=\"margin:0;font-size:clamp(28px,4vw,38px);font-weight:300;letter-spacing:-.03em;line-height:1.12;color:#f4f4f5\">We remember why you came.<\u002Fh1>\n\n  <div style=\"display:flex;align-items:center;gap:11px;margin:22px 0 0;padding:13px 16px;border:1px solid rgba(251,146,60,.28);border-radius:10px;background:rgba(251,146,60,.05)\">\n    <img class=\"px\" src=\"bb7787a4-53c8-4c1a-9085-32ea032ec570\" alt=\"\" aria-hidden=\"true\" width=\"34\" height=\"34\" style=\"width:34px;height:34px;flex:none\">\n    <div style=\"min-width:0\">\n      <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">Taking you back to<\u002Fp>\n      <p style=\"margin:2px 0 0;font-size:13.5px;color:#f4f4f5\">Kintsugi Architecture › Workshop › Mira's reply<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ signinIdle }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:20px;padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#0e0e11\">\n      <label for=\"ts-handle\" style=\"display:block;font-size:13.5px;color:#c9c9d1\">Your AT Protocol handle<\u002Flabel>\n      <input id=\"ts-handle\" type=\"text\" value=\"{{ handleDraft }}\" sc-camel-on-change=\"{{ onHandle }}\" placeholder=\"you.bsky.social\" style=\"display:block;width:100%;margin-top:8px;min-height:44px;padding:11px 13px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:rgba(0,0,0,.3);color:#f4f4f5;font:400 14px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:16px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onSigninVisitor }}\" style=\"min-height:42px;padding:11px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d\">Continue<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onSigninOwner }}\" style=\"min-height:42px;padding:11px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.4)\">Continue as Leo (owner)<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:18px 0 0;padding-top:15px;border-top:1px solid rgba(255,255,255,.07);font-size:12.5px;line-height:1.65;color:#8f8f99\">This prototype accepts compatible test accounts. Native AT Spaces is still experimental, so account readiness is real here — some accounts can read before they can post. <button type=\"button\" sc-camel-on-click=\"{{ onDiagnostics }}\" style=\"display:inline-block;padding:7px 3px;margin:-7px -3px;border:0;background:none;color:#fcd34d;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Protocol details<\u002Fbutton><\u002Fp>\n      <sc-if value=\"{{ diagOpen }}\">\n        <pre style=\"margin:12px 0 0;padding:13px;border-radius:8px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 0 0 1px rgba(0,0,0,.2);font:400 11px/1.7 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99;white-space:pre-wrap\">pds        bsky.social (delegated)\ndid        did:plc:7k2q… verified 4s ago\nlexicon    space.tangent.channel  v0.4 draft\nspaces     experimental — falling back to app-managed rooms<\u002Fpre>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ signinBlocked }}\">\n    <div style=\"margin-top:20px;padding:22px;border:1px solid rgba(251,146,60,.3);border-radius:14px;background:rgba(251,146,60,.045)\">\n      <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#fb923c\">Before you write<\u002Fp>\n      <h2 style=\"margin:9px 0 0;font-size:21px;font-weight:400;letter-spacing:-.01em;color:#f4f4f5\">You're in as hana.bsky.social — reading, not posting yet.<\u002Fh2>\n      <p style=\"margin:10px 0 0;font-size:14px;color:#c9c9d1\">Kintsugi Architecture approves new accounts before they can post. Mira usually answers within a day. Nothing you write would be lost — but we'd rather you knew first.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onAskToJoin }}\" style=\"min-height:42px;padding:11px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d\">Ask to join<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onSigninOwner }}\" style=\"min-height:42px;padding:11px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"border-color:rgba(255,255,255,.4)\">Switch to Leo (owner)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ signinAsked }}\">\n    <div style=\"margin-top:20px;padding:22px;border:1px solid rgba(74,222,128,.3);border-radius:14px;background:rgba(74,222,128,.04)\">\n      <p style=\"margin:0;font-size:15px;color:#f4f4f5\">Asked. You'll get a reply from Mira — and you keep your place in Workshop while you wait.<\u002Fp>\n      <button type=\"button\" sc-camel-on-click=\"{{ onSigninOwner }}\" style=\"margin-top:16px;min-height:42px;padding:11px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\">Continue the story as Leo<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFirstrun }}\">\n<main style=\"position:relative;overflow:hidden;background:radial-gradient(ellipse 74% 58% at 50% -10%,#231c2e 0%,#141218 54%,#0f0e12 100%)\">\n  <div style=\"max-width:720px;margin:0 auto;padding:52px 26px 80px\">\n    <sc-if value=\"{{ frResumed }}\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:11px 15px;border:1px solid rgba(251,191,36,.3);border-radius:8px;background:rgba(251,191,36,.06)\">\n        <span style=\"width:8px;height:8px;transform:rotate(45deg);background:#fbbf24;flex:none\"><\u002Fspan>\n        <p style=\"margin:0;font-size:13px;color:#e4e4e7\">You left off naming your first channel. Nothing you finished has been undone.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:26px\">\n      <sc-for list=\"{{ frDots }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <span aria-hidden=\"true\" style=\"height:3px;flex:1;border-radius:2px;background:{{ d.bg }}\"><\u002Fspan>\n      <\u002Fsc-for>\n      <span style=\"font:600 9.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#8f8f99;flex:none\">{{ frCount }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ frIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center\">\n        <div style=\"position:relative;display:inline-block;margin-bottom:8px\">\n          <span aria-hidden=\"true\" style=\"position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.17),transparent 68%);animation:ts-halo 5s ease-in-out infinite\"><\u002Fspan>\n          <img class=\"px\" src=\"354cd80b-fee1-4d51-b2ba-8018f26be771\" alt=\"\" aria-hidden=\"true\" width=\"150\" height=\"150\" style=\"position:relative;width:150px;height:150px\">\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-size:clamp(30px,4.6vw,44px);font-weight:300;letter-spacing:-.035em;line-height:1.1;color:#f4f4f5\">Welcome, Leo! This is your own Tangent space.<\u002Fh1>\n        <p style=\"margin:16px auto 0;max-width:440px;font-size:17px;color:#c9c9d1\">Make yourself at home. We'll set up one community together — three short steps, and you can stop anywhere.<\u002Fp>\n        <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ frNext }}\" style=\"min-height:44px;padding:12px 22px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d;transform:translateY(-2px)\">Make a place<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:22px 0 0;font:400 11px/1.6 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">You are the owner of this installation · claimed by installer at first boot<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ frIs1 }}\">\n      <div>\n        <h1 style=\"margin:0;font-size:clamp(27px,4vw,36px);font-weight:300;letter-spacing:-.03em;color:#f4f4f5\">What would you like to call it?<\u002Fh1>\n        <p style=\"margin:12px 0 0;font-size:16px;color:#a1a1aa\">You can make more Tangents later. This one is just the first.<\u002Fp>\n        <input id=\"ts-tname\" type=\"text\" value=\"{{ frName }}\" sc-camel-on-change=\"{{ onFrName }}\" placeholder=\"Kintsugi Architecture\" aria-label=\"Tangent name\" style=\"display:block;width:100%;margin-top:22px;min-height:56px;padding:14px 16px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(0,0,0,.3);color:#f4f4f5;font:300 24px/1.3 inherit;letter-spacing:-.02em\">\n        <div style=\"margin-top:20px;padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.015)\">\n          <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">Who can see it<\u002Fp>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:11px\">\n            <sc-for list=\"{{ frAudiences }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ a.onClick }}\" aria-pressed=\"{{ a.on }}\" style=\"min-height:36px;padding:8px 13px;border:1px solid {{ a.border }};border-radius:999px;background:{{ a.bg }};color:{{ a.fg }};font:500 12.5px/1 inherit;cursor:pointer\">{{ a.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:11px 0 0;font-size:12.5px;color:#8f8f99\">{{ frAudienceNote }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:24px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ frNext }}\" disabled=\"{{ frNameEmpty }}\" style=\"min-height:44px;padding:12px 22px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer;opacity:{{ frNameOpacity }}\">Next<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ frBack }}\" style=\"min-height:44px;padding:12px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\">Back<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ frIs2 }}\">\n      <div>\n        <h1 style=\"margin:0;font-size:clamp(27px,4vw,36px);font-weight:300;letter-spacing:-.03em;color:#f4f4f5\">A couple of rooms to start with?<\u002Fh1>\n        <p style=\"margin:12px 0 0;font-size:16px;color:#a1a1aa\">Pick what sounds useful. You don't have to design the whole community now — channels are cheap and renameable.<\u002Fp>\n        <div style=\"display:grid;gap:9px;margin-top:22px\">\n          <sc-for list=\"{{ frSuggestions }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" aria-pressed=\"{{ s.on }}\" style=\"display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;border:1px solid {{ s.border }};border-radius:10px;background:{{ s.bg }};color:inherit;font:inherit;cursor:pointer;transition:border-color .2s\" style-hover=\"border-color:rgba(251,191,36,.4)\">\n              <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;border:1.5px solid {{ s.mark }};background:{{ s.markBg }};color:#18181b;font:700 11px/1 inherit\">{{ s.tick }}<\u002Fspan>\n              <span style=\"min-width:0\">\n                <span style=\"display:block;font-size:14.5px;font-weight:500;color:#f4f4f5\">{{ s.name }}<\u002Fspan>\n                <span style=\"display:block;margin-top:2px;font-size:12.5px;color:#8f8f99\">{{ s.why }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"margin-left:auto;flex:none;font:500 9.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:{{ s.audFg }}\">{{ s.aud }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:24px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ frNext }}\" style=\"min-height:44px;padding:12px 22px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\">Next<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ frBack }}\" style=\"min-height:44px;padding:12px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\">Back<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ frIs3 }}\">\n      <div>\n        <h1 style=\"margin:0;font-size:clamp(27px,4vw,36px);font-weight:300;letter-spacing:-.03em;color:#f4f4f5\">Want someone to help you look after things?<\u002Fh1>\n        <p style=\"margin:12px 0 0;font-size:16px;color:#a1a1aa\">You can do this later. An administrator can make channels and manage members; they can't remove you.<\u002Fp>\n        <div style=\"margin-top:22px;padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#0e0e11\">\n          <label for=\"ts-helper\" style=\"display:block;font-size:13.5px;color:#c9c9d1\">Their handle<\u002Flabel>\n          <input id=\"ts-helper\" type=\"text\" value=\"{{ frHelper }}\" sc-camel-on-change=\"{{ onFrHelper }}\" placeholder=\"mira.bsky.social\" style=\"display:block;width:100%;margin-top:8px;min-height:44px;padding:11px 13px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:rgba(0,0,0,.3);color:#f4f4f5;font:400 14px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)\">\n            <div style=\"min-width:0\">\n              <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">They'll receive<\u002Fp>\n              <p style=\"margin:3px 0 0;font-size:13px;color:#e4e4e7\">Administrator of {{ frNameShown }} · all channels<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ onCopyInvite }}\" style=\"flex:none;min-height:38px;padding:9px 15px;border:1px solid rgba(251,191,36,.42);border-radius:6px;background:rgba(251,191,36,.09);color:#fcd34d;font:500 12.5px/1 inherit;cursor:pointer\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:24px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ frNext }}\" style=\"min-height:44px;padding:12px 22px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\">Send the invitation<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ frNext }}\" style=\"min-height:44px;padding:12px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\">Skip for now<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ frIs4 }}\">\n      <div style=\"text-align:center\">\n        <div style=\"position:relative;display:inline-block;margin-bottom:10px\">\n          <span aria-hidden=\"true\" style=\"position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.22),transparent 68%);animation:ts-halo 5s ease-in-out infinite\"><\u002Fspan>\n          <img class=\"px\" src=\"bb7787a4-53c8-4c1a-9085-32ea032ec570\" alt=\"\" aria-hidden=\"true\" width=\"160\" height=\"160\" style=\"position:relative;width:160px;height:160px\">\n        <\u002Fdiv>\n        <p style=\"margin:0 0 10px;font:500 11px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24\">Your place exists<\u002Fp>\n        <h1 style=\"margin:0;font-size:clamp(29px,4.4vw,42px);font-weight:300;letter-spacing:-.035em;line-height:1.1;color:#f4f4f5\">{{ frNameShown }} is yours.<\u002Fh1>\n        <p style=\"margin:16px auto 0;max-width:430px;font-size:17px;color:#c9c9d1\">{{ frDoneNote }}<\u002Fp>\n        <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goLive }}\" style=\"min-height:44px;padding:12px 22px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d;transform:translateY(-2px)\">Say the first thing in Workshop<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ goReturn }}\" style=\"min-height:44px;padding:12px 20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 14px/1 inherit;cursor:pointer\">Look around first<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLive }}\">\n<main style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:0;max-width:1500px;margin:0 auto;min-height:calc(100vh - 96px)\">\n\n  <nav aria-label=\"Tangents\" style=\"flex:none;display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;width:100%;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2)\">\n    <sc-for list=\"{{ tangents }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" aria-current=\"{{ t.current }}\" style=\"position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px 6px 7px;border:1px solid {{ t.border }};border-radius:999px;background:{{ t.bg }};color:inherit;font:inherit;cursor:pointer;transition:border-color .2s\" style-hover=\"border-color:rgba(255,255,255,.32)\">\n        <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;overflow:hidden;background:radial-gradient(circle,rgba({{ t.argb }},.3),transparent 70%);border:1px solid rgba({{ t.argb }},.45);color:{{ t.a }};font:700 12px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">{{ t.faceNode }}<\u002Fspan>\n        <span style=\"font-size:13.5px;font-weight:500;color:{{ t.fg }}\">{{ t.name }}<\u002Fspan>\n        <sc-if value=\"{{ t.addressed }}\"><span title=\"Someone replied to you\" style=\"flex:none;width:9px;height:9px;transform:rotate(45deg);background:{{ t.a }};box-shadow:0 0 8px rgba({{ t.argb }},.8)\"><\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ t.showRing }}\"><span title=\"New activity\" style=\"flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid #a1a1aa\"><\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ t.showCount }}\"><span style=\"flex:none;font:600 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#a1a1aa\">{{ t.countLabel }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <div style=\"flex:1 1 236px;min-width:210px;max-width:290px;border-right:1px solid rgba(255,255,255,.07);padding:20px 16px\">\n    <div style=\"display:flex;align-items:flex-start;gap:11px\">\n      <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;overflow:hidden;background:radial-gradient(circle,rgba({{ curArgb }},.28),transparent 70%);border:1px solid rgba({{ curArgb }},.4)\">{{ curFaceNode }}<\u002Fspan>\n      <div style=\"min-width:0\">\n        <h2 style=\"margin:0;font-size:15px;font-weight:600;color:#f4f4f5;line-height:1.3\">{{ curTangentName }}<\u002Fh2>\n        <p style=\"margin:2px 0 0;font:500 9.5px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#8f8f99\">{{ curTangentRole }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ curEmpty }}\">\n      <div style=\"margin-top:20px;padding:18px 16px;border:1px dashed rgba(74,222,128,.35);border-radius:12px;background:rgba(74,222,128,.03);text-align:center\">\n        <p style=\"margin:0;font-size:13.5px;color:#e4e4e7\">Nothing here yet — and that's fine.<\u002Fp>\n        <p style=\"margin:7px 0 0;font-size:12.5px;color:#8f8f99\">A Tangent with no channels is a room you haven't furnished.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ onMakeChannel }}\" style=\"margin-top:14px;min-height:38px;padding:9px 15px;border:1px solid rgba(74,222,128,.4);border-radius:6px;background:rgba(74,222,128,.08);color:#86efac;font:500 12.5px/1 inherit;cursor:pointer\">Make the first channel<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ curHasChannels }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:18px\">\n        <p style=\"margin:0 0 8px;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8f8f99\">Channels<\u002Fp>\n        <div style=\"display:grid;gap:2px\">\n          <sc-for list=\"{{ channels }}\" as=\"ch\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ch.onClick }}\" aria-current=\"{{ ch.current }}\" style=\"display:flex;align-items:center;gap:9px;width:100%;text-align:left;min-height:38px;padding:7px 10px;border:0;border-left:2px solid {{ ch.mark }};border-radius:0 6px 6px 0;background:{{ ch.bg }};color:inherit;font:inherit;cursor:pointer;transition:background .18s\" style-hover=\"background:rgba(255,255,255,.045)\">\n              <span aria-hidden=\"true\" style=\"flex:none;font:400 12px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ ch.sigil }}<\u002Fspan>\n              <span style=\"min-width:0;flex:1;font-size:13.5px;font-weight:{{ ch.weight }};color:{{ ch.fg }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ch.name }}<\u002Fspan>\n              <sc-if value=\"{{ ch.addressed }}\"><span title=\"A reply to you\" style=\"flex:none;width:8px;height:8px;transform:rotate(45deg);background:#fbbf24\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ ch.watchedNew }}\"><span title=\"New in a thread you watch\" style=\"flex:none;width:7px;height:7px;border-radius:50%;background:#a1a1aa\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ ch.showRing }}\"><span title=\"New activity\" style=\"flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid #71717a\"><\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ ch.showCount }}\"><span style=\"flex:none;font:600 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ ch.countLabel }}<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ ch.muted }}\"><span title=\"You muted notifications here\" aria-label=\"muted\" style=\"flex:none;font:400 9px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">muted<\u002Fspan><\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px\">\n        <p style=\"margin:0 0 8px;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8f8f99\">Posts<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ onOpenPost }}\" style=\"display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.015);color:inherit;font:inherit;cursor:pointer\" style-hover=\"border-color:rgba(251,191,36,.4)\">\n          <span style=\"min-width:0\">\n            <span style=\"display:block;font-size:13px;font-weight:500;color:#f4f4f5\">The Gold Seam<\u002Fspan>\n            <span style=\"display:inline-block;margin-top:5px;padding:2px 7px;border-radius:3px;border:1px solid rgba(251,146,60,.4);font:600 8.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#fdba74\">Draft · not published<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onOpenInvite }}\" style=\"width:100%;min-height:38px;padding:9px 12px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:transparent;color:#c9c9d1;font:500 12.5px/1 inherit;cursor:pointer;text-align:left\" style-hover=\"border-color:rgba(251,191,36,.4);color:#f4f4f5\">Invite someone…<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <section aria-label=\"Conversation\" style=\"flex:999 1 460px;min-width:min(100%,320px);display:flex;flex-direction:column\">\n    <header style=\"padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.07)\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n        <h1 style=\"margin:0;font-size:19px;font-weight:500;letter-spacing:-.01em;color:#f4f4f5\">{{ chanName }}<\u002Fh1>\n        <span style=\"padding:2px 8px;border-radius:999px;border:1px solid {{ audBorder }};font:600 8.5px/1.6 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:{{ audFg }}\">{{ audLabel }}<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onToggleWatch }}\" aria-pressed=\"{{ watching }}\" style=\"min-height:32px;padding:6px 11px;border:1px solid {{ watchBorder }};border-radius:6px;background:{{ watchBg }};color:{{ watchFg }};font:500 11.5px/1 inherit;cursor:pointer\">{{ watchLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onToggleMute }}\" aria-pressed=\"{{ muted }}\" style=\"min-height:32px;padding:6px 11px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:transparent;color:#a1a1aa;font:500 11.5px/1 inherit;cursor:pointer\" style-hover=\"color:#f4f4f5\">{{ muteLabel }}<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onOpenManage }}\" style=\"min-height:32px;padding:6px 11px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:transparent;color:#a1a1aa;font:500 11.5px/1 inherit;cursor:pointer\" style-hover=\"color:#f4f4f5\">People<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:9px 0 0;font-size:13px;color:#8f8f99;max-width:640px\">{{ chanTopic }}<\u002Fp>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ accessChanged }}\">\n      <div role=\"status\" style=\"display:flex;align-items:flex-start;gap:11px;margin:14px 22px 0;padding:13px 15px;border:1px solid rgba(251,146,60,.34);border-radius:10px;background:rgba(251,146,60,.06)\">\n        <span aria-hidden=\"true\" style=\"flex:none;margin-top:6px;width:8px;height:8px;transform:rotate(45deg);background:#fb923c\"><\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;color:#e4e4e7\"><strong style=\"font-weight:600;color:#f4f4f5\">Posting in {{ chanName }} is paused for you.<\u002Fstrong> Mira set this 20 minutes ago; it lifts in 40. You can still read, save and search everything you could before.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sessionExpired }}\">\n      <div role=\"alertdialog\" aria-label=\"Session expired\" style=\"margin:14px 22px 0;padding:17px;border:1px solid rgba(251,191,36,.4);border-radius:12px;background:rgba(251,191,36,.07)\">\n        <p style=\"margin:0;font-size:14.5px;color:#f4f4f5\"><strong style=\"font-weight:600\">Your session expired while you were typing.<\u002Fstrong><\u002Fp>\n        <p style=\"margin:7px 0 0;font-size:13.5px;color:#c9c9d1\">Your draft is safe, held under leo.tangent.space. Sign in again and we'll send it as you — not as whoever signs in next.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ onResumeSession }}\" style=\"margin-top:14px;min-height:40px;padding:10px 18px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 13.5px/1 inherit;cursor:pointer\">Sign in again<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:1;padding:8px 0 4px\">\n      <sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"5\">\n        <div>\n          <sc-if value=\"{{ m.divider }}\">\n            <div role=\"separator\" style=\"display:flex;align-items:center;gap:11px;padding:12px 22px 6px\">\n              <span style=\"height:1px;flex:1;background:rgba(251,191,36,.34)\"><\u002Fspan>\n              <span style=\"font:600 9px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#fcd34d\">New since you looked<\u002Fspan>\n              <span style=\"height:1px;flex:1;background:rgba(251,191,36,.34)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <article style=\"display:flex;gap:12px;padding:9px 22px;background:{{ m.rowBg }};border-left:2px solid {{ m.rowMark }};animation:{{ m.anim }}\">\n            <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;overflow:hidden;background:rgba({{ m.argb }},.14);border:1px solid rgba({{ m.argb }},.38);color:{{ m.accent }};font:600 11.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">{{ m.avatarNode }}<\u002Fspan>\n            <div style=\"min-width:0;flex:1\">\n              <sc-if value=\"{{ m.hasReply }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ m.onSeeContext }}\" style=\"display:flex;align-items:center;gap:7px;max-width:100%;margin:0 0 4px;padding:3px 8px 3px 6px;border:0;border-left:2px solid rgba(255,255,255,.18);border-radius:0 4px 4px 0;background:rgba(255,255,255,.03);color:inherit;font:inherit;cursor:pointer;text-align:left\" style-hover=\"background:rgba(255,255,255,.06)\">\n                  <span style=\"font:500 10.5px/1.4 inherit;color:#8f8f99;flex:none\">{{ m.replyName }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:#a1a1aa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ m.replyBody }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <p style=\"margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.4\">\n                <span style=\"font-size:13.5px;font-weight:600;color:#f4f4f5\">{{ m.author }}<\u002Fspan>\n                <sc-if value=\"{{ m.isAgent }}\">\n                  <span style=\"display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;border:1px solid rgba(94,234,212,.4);background:rgba(94,234,212,.08);font:600 8.5px/1.6 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#5eead4\">Agent<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"font:400 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ m.handle }}<\u002Fspan>\n                <span style=\"font:400 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ m.time }}<\u002Fspan>\n                <sc-if value=\"{{ m.pinned }}\">\n                  <span style=\"display:inline-flex;align-items:center;gap:5px;font:600 8.5px/1.6 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#fbbf24\"><span aria-hidden=\"true\" style=\"width:6px;height:6px;transform:rotate(45deg);background:#fbbf24\"><\u002Fspan>Pinned<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fp>\n              <p style=\"margin:3px 0 0;font-size:14.5px;line-height:1.62;color:#c9c9d1;text-wrap:pretty\">{{ m.body }}<\u002Fp>\n              <sc-if value=\"{{ m.statusShown }}\">\n                <p style=\"margin:6px 0 0;display:flex;align-items:center;gap:7px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.04em;color:{{ m.statusFg }}\">\n                  <span aria-hidden=\"true\" style=\"width:7px;height:7px;border-radius:{{ m.statusRadius }};background:{{ m.statusDot }};border:1px solid {{ m.statusFg }}\"><\u002Fspan>\n                  <span>{{ m.statusLabel }}<\u002Fspan>\n                  <sc-if value=\"{{ m.retryable }}\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ m.onRetry }}\" style=\"padding:2px 8px;border:1px solid currentColor;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer\">Retry<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:12px;margin-top:6px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ m.onReply }}\" style=\"display:inline-flex;align-items:center;min-height:30px;padding:7px 3px;margin:-7px -3px;border:0;background:none;color:#a1a1aa;font:500 11.5px/1 inherit;cursor:pointer\" style-hover=\"color:#fbbf24\">Reply<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ m.onPin }}\" style=\"display:inline-flex;align-items:center;min-height:30px;padding:7px 3px;margin:-7px -3px;border:0;background:none;color:#a1a1aa;font:500 11.5px/1 inherit;cursor:pointer\" style-hover=\"color:#fbbf24\">{{ m.pinLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ hasNewBelow }}\">\n        <div style=\"position:sticky;bottom:8px;display:flex;justify-content:center;padding:10px 22px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onJumpLatest }}\" style=\"display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:9px 16px;border:1px solid rgba(251,191,36,.5);border-radius:999px;background:rgba(25,22,16,.94);backdrop-filter:blur(8px);color:#fcd34d;font:500 12.5px/1 inherit;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.9)\" style-hover=\"background:rgba(251,191,36,.16)\">\n            <span aria-hidden=\"true\" style=\"width:8px;height:8px;transform:rotate(45deg);background:#fbbf24\"><\u002Fspan>\n            {{ newBelowLabel }}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <footer style=\"padding:14px 22px 20px;border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.18)\">\n      <sc-if value=\"{{ canPost }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <sc-if value=\"{{ hasReplyTarget }}\">\n            <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:9px;padding:7px 11px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:rgba(255,255,255,.025)\">\n              <span style=\"font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8f8f99;flex:none\">Replying to<\u002Fspan>\n              <span style=\"min-width:0;flex:1;font-size:12.5px;color:#c9c9d1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ replyTargetLabel }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ onClearReply }}\" aria-label=\"Stop replying\" style=\"flex:none;width:26px;height:26px;border:0;border-radius:5px;background:transparent;color:#8f8f99;font:400 15px/1 inherit;cursor:pointer\" style-hover=\"color:#f4f4f5;background:rgba(255,255,255,.06)\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap\">\n            <textarea aria-label=\"Write a message\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" placeholder=\"{{ composerPlaceholder }}\" rows=\"2\" style=\"flex:1 1 240px;min-width:0;min-height:52px;padding:12px 14px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(0,0,0,.32);color:#f4f4f5;font:400 14.5px/1.55 inherit;resize:vertical\"><\u002Ftextarea>\n            <button type=\"button\" sc-camel-on-click=\"{{ onSend }}\" style=\"flex:none;min-height:44px;padding:12px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d\">{{ sendLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:9px 0 0;display:flex;align-items:center;gap:8px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.04em;color:{{ connFg }}\">\n            <span aria-hidden=\"true\" style=\"width:7px;height:7px;border-radius:50%;background:{{ connFg }}\"><\u002Fspan>{{ connLabel }}\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cannotPost }}\">\n        <div style=\"display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.02)\">\n          <span aria-hidden=\"true\" style=\"flex:none;margin-top:6px;width:8px;height:8px;border-radius:50%;border:1.5px solid #71717a\"><\u002Fspan>\n          <p style=\"margin:0;font-size:13.5px;color:#a1a1aa\">{{ cannotPostNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Ffooter>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ manageOpen }}\">\n    <div role=\"dialog\" aria-label=\"People and access\" style=\"position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(4,4,6,.6);backdrop-filter:blur(3px)\">\n      <div style=\"width:min(430px,100%);height:100%;overflow-y:auto;border-left:1px solid rgba(255,255,255,.12);background:#0e0e11;box-shadow:-18px 0 48px -12px rgba(0,0,0,.8)\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"min-width:0;flex:1\">\n            <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">Kintsugi Architecture › {{ chanName }}<\u002Fp>\n            <h2 style=\"margin:3px 0 0;font-size:18px;font-weight:500;color:#f4f4f5\">People and access<\u002Fh2>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseManage }}\" aria-label=\"Close\" style=\"flex:none;width:34px;height:34px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:transparent;color:#a1a1aa;font:400 17px/1 inherit;cursor:pointer\" style-hover=\"color:#f4f4f5\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ manageDone }}\">\n          <div role=\"status\" style=\"display:flex;align-items:center;gap:11px;margin:18px 22px 0;padding:14px 15px;border:1px solid rgba(74,222,128,.35);border-radius:10px;background:rgba(74,222,128,.05)\">\n            <span aria-hidden=\"true\" style=\"flex:none;color:#4ade80\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <p style=\"margin:0;font-size:14px;color:#f4f4f5\">{{ manageDoneMsg }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ manageList }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:18px 22px 26px\">\n            <p style=\"margin:0 0 10px;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8f8f99\">Here now · {{ peopleCount }}<\u002Fp>\n            <div style=\"display:grid;gap:6px\">\n              <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:rgba(255,255,255,.015);color:inherit;font:inherit;cursor:pointer\" style-hover=\"border-color:rgba(251,191,36,.4)\">\n                  <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;overflow:hidden;background:rgba({{ p.argb }},.14);border:1px solid rgba({{ p.argb }},.38);color:{{ p.accent }};font:600 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace\">{{ p.avatarNode }}<\u002Fspan>\n                  <span style=\"min-width:0;flex:1\">\n                    <span style=\"display:flex;align-items:baseline;gap:7px;flex-wrap:wrap\">\n                      <span style=\"font-size:13.5px;font-weight:500;color:#f4f4f5\">{{ p.name }}<\u002Fspan>\n                      <sc-if value=\"{{ p.isAgent }}\"><span style=\"padding:1px 6px;border-radius:999px;border:1px solid rgba(94,234,212,.4);font:600 8px/1.6 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#5eead4\">Agent<\u002Fspan><\u002Fsc-if>\n                    <\u002Fspan>\n                    <span style=\"display:block;margin-top:1px;font:400 10px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">{{ p.handle }} · {{ p.role }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span aria-hidden=\"true\" style=\"flex:none;color:#8f8f99\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 4l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:20px;padding:14px 15px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:rgba(255,255,255,.015)\">\n              <p style=\"margin:0;font-size:12.5px;line-height:1.65;color:#8f8f99\"><strong style=\"color:#c9c9d1;font-weight:500\">Muting is yours; restricting is theirs.<\u002Fstrong> Muting a channel quiets it for you alone. Restricting posting stops someone else writing here. The two never share a control.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ manageActions }}\">\n          <div style=\"padding:18px 22px 26px\">\n
