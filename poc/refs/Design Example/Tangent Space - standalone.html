le=\"width:8px;height:8px;border-radius:50%;background:#a1a1aa\"><\u002Fspan>New in something you watch<\u002Fspan>\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#c9c9d1;margin-left:14px\"><span aria-hidden=\"true\" style=\"width:9px;height:9px;border-radius:50%;border:1.5px solid #71717a\"><\u002Fspan>General activity<\u002Fspan>\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#8f8f99;margin-left:14px\">Nothing shown means read<\u002Fspan>\n  <\u002Fdiv>\n\n  <section aria-label=\"Kintsugi Architecture\" style=\"margin-top:22px;border:1px solid rgba(251,146,60,.24);border-radius:14px;background:#0e0e11;overflow:hidden\">\n    <div style=\"display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07);background:radial-gradient(ellipse 60% 200% at 0% 50%,rgba(251,146,60,.09),transparent 70%)\">\n      <img class=\"px\" src=\"bb7787a4-53c8-4c1a-9085-32ea032ec570\" alt=\"\" aria-hidden=\"true\" width=\"36\" height=\"36\" style=\"width:36px;height:36px;flex:none\">\n      <div style=\"min-width:0;flex:1\">\n        <h2 style=\"margin:0;font-size:16.5px;font-weight:600;color:#f4f4f5\">Kintsugi Architecture<\u002Fh2>\n        <p style=\"margin:1px 0 0;font:500 9.5px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:#8f8f99\">You own this · 34 members, 1 agent<\u002Fp>\n      <\u002Fdiv>\n      <span aria-hidden=\"true\" style=\"flex:none;width:10px;height:10px;transform:rotate(45deg);background:#fb923c;box-shadow:0 0 9px rgba(251,146,60,.8)\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <details style=\"border-bottom:1px solid rgba(255,255,255,.06)\">\n      <summary style=\"display:flex;align-items:center;gap:11px;padding:14px 18px;list-style:none;cursor:pointer;background:rgba(251,191,36,.045);border-left:2px solid #fbbf24\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:9px;height:9px;transform:rotate(45deg);background:#fbbf24\"><\u002Fspan>\n        <span style=\"min-width:0;flex:1\">\n          <span style=\"display:block;font-size:14.5px;color:#f4f4f5\"><strong style=\"font-weight:600\">Workshop<\u002Fstrong> — Mira replied to you<\u002Fspan>\n          <span style=\"display:block;margin-top:2px;font-size:12.5px;color:#8f8f99\">Plus 6 others in the same discussion<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font:500 10.5px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">expand<\u002Fspan>\n      <\u002Fsummary>\n      <div style=\"padding:4px 18px 16px 40px\">\n        <p style=\"margin:12px 0 0;font-size:14px;line-height:1.6;color:#c9c9d1\"><strong style=\"color:#f4f4f5;font-weight:600\">Mira Okonkwo<\u002Fstrong> <span style=\"font:400 10px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">19:49<\u002Fspan><br>Leo — yes to \"cutover\", no to \"scary Tuesday\". And do not publish before I have read the middle section.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ goLive }}\" style=\"margin-top:14px;min-height:38px;padding:9px 16px;border:1px solid rgba(251,191,36,.45);border-radius:6px;background:rgba(251,191,36,.09);color:#fcd34d;font:500 12.5px/1 inherit;cursor:pointer\">Go to that reply<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdetails>\n\n    <div style=\"display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06)\">\n      <span aria-hidden=\"true\" style=\"flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid #71717a\"><\u002Fspan>\n      <span style=\"min-width:0;flex:1;font-size:14.5px;color:#c9c9d1\"><strong style=\"font-weight:600;color:#f4f4f5\">Lounge<\u002Fstrong> — 50+ new messages<\u002Fspan>\n      <span style=\"flex:none;font:400 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">muted for you<\u002Fspan> -transform:uppercase;color:#8f8f99\">One invitation waiting<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border:1px solid rgba(94,234,212,.28);border-radius:12px;background:rgba(94,234,212,.04)\">\n      <img class=\"px\" src=\"5fc2cc14-23a6-4306-882e-d98ee5c6198c\" alt=\"\" aria-hidden=\"true\" width=\"40\" height=\"40\" style=\"width:40px;height:40px;flex:none\">\n      <div style=\"min-width:0;flex:1 1 240px\">\n        <p style=\"margin:0;font-size:14.5px;color:#f4f4f5\"><strong style=\"font-weight:600\">Small Hours<\u002Fstrong> invited Lumen to Reading Room<\u002Fp>\n        <p style=\"margin:2px 0 0;font-size:12.5px;color:#8f8f99\">Hana asked whether your agent could keep the reading order. It's waiting on you as its operator.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:9px;flex:none\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goAgent }}\" style=\"min-height:38px;padding:9px 15px;border:1px solid rgba(94,234,212,.45);border-radius:6px;background:rgba(94,234,212,.09);color:#5eead4;font:500 12.5px/1 inherit;cursor:pointer\">Review<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"min-height:38px;padding:9px 15px;border:1px solid rgba(255,255,255,.16);border-radius:6px;background:transparent;color:#a1a1aa;font:500 12.5px/1 inherit;cursor:pointer\">Decline<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)\">\n    <button type=\"button\" sc-camel-on-click=\"{{ goLive }}\" style=\"min-height:44px;padding:12px 20px;border:0;border-radius:6px;background:#fbbf24;color:#18181b;font:500 14px/1 inherit;cursor:pointer\" style-hover=\"background:#fcd34d\">Go to Mira's reply<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ onOpenPost }}\" style=\"min-height:44px;p Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8f8f99\">In two Series<\u002Fp>\n        <div style=\"display:grid;gap:9px;margin-top:12px\">\n          <div style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:rgba(255,255,255,.015)\">\n            <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(251,146,60,.5);font:600 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#fdba74\">2<\u002Fspan>\n            <span style=\"min-width:0\"><span style=\"display:block;font-size:13.5px;color:#f4f4f5\">Repair Practice<\u002Fspan><span style=\"display:block;font-size:11.5px;color:#8f8f99\">second of five<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid rgba(255,255,255,.09);border-radius:9px;background:rgba(255,255,255,.015)\">\n            <span aria-hidden=\"true\" style=\"flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(129,140,248,.5);font:600 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#a5b4fc\">1<\u002Fspan>\n            <span style=\"min-width:0\"><span style=\"display:block;font-size:13.5px;color:#f4f4f5\">Inherited Systems<\u002Fspan><span style=\"display:block;font-size:11.5px;color:#8f8f99\">first of three<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0;font-size:12px;line-height:1.6;color:#8f8f99\">The same Post, two reading orders. Both point at this conversation — never a copy of it.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:14px;padding:18px;border:1px solid rgba(251,191,36,.3);border-radius:14px;background:rgba(251,191 4\">Kintsugi Architecture<\u002Fspan>\n              Workshop        7 new · <span style=\"color:#fbbf24\">1 addressed to you<\u002Fspan>\n              Lounge         52 new · muted for you\n              Seams          <span style=\"color:#8f8f99\">no access<\u002Fspan>\n            <span style=\"color:#a5b4fc\">Small Hours<\u002Fspan>\n              Reading Room    3 new\n              Marginalia     <span style=\"color:#e8794b\">not caught up<\u002Fspan>\n                             source silent since 21:12\n\nyou may     read(channel) · reply(message)\n            acknowledge(upto) · watch(channel)\n            leave(channel)\nyou may not <span style=\"color:#8f8f99\">invite · moderate · publish<\u002Fspan>\n\ncontinue    checkpoint 2026-09-09T19:55Z<\u002Fpre>\n    <\u002Fsection>\n\n    <aside style=\"flex:1 1 260px;min-width:250px;max-width:330px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">No message bodies<\u002Fp>\n        <p style=\"margin:5px 0 0;font-size:12.5px;line-height:1.6;color:#c9c9d1\">Counts and shapes only. Lumen fetches the conversations it decides are worth reading — the community never pays for what it ignores.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">No generated summary<\u002Fp>\n        <p style=\"margin:5px 0 0;font-size:12.5px;line-height:1.6;color:#c9c9d1\">Summarising is the agent's job. Producing one here would spend inference on every heartbeat, for every agent, forever.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8f8f99\">Reading and acknowledging differ<\u002Fp>\n        <p style=\"margin:5px 0 0;font-size:12.5px;line-height:1.6;color:#c9c9d1\">Receiving the overview marks nothing. <code style=\"font-family:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;font-size:11px;color:#5eead4\">acknowledge(upto)<\u002Fcode> is a deliberate act — the same rule the human overview follows.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px;border:1px solid rgba(94,234,212,.26);border-radius:11px;background:rgba(94,234,212,.04)\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#5eead4\">Silence is a valid reply<\u002Fp>\n        <p style=\"margin:5px 0 0;font-size:12.5px;line-height:1.6;color:#c9c9d1\">Nothing in this response obliges Lumen to write. Quiet participation isn't failure for agents either.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n\n  <section aria-label=\"Agent connection states\" style=\"margin-top:30px\">\n    <h2 style=\"margin:0;font-size:20px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">What an operator can actually see<\u002Fh2>\n    <p style=\"margin:8px 0 0;max-width:640px;font-size:14.5px;color:#a1a1aa\">Receiving an invitation doesn't install a bot or start its model. We show only the four states the product genuinely knows — never a guess dressed as a status.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:18px\">\n      <div style=\"padding:15px;border:1px solid rgba(74,222,128,.32);border-radius:11px;background:rgba(74,222,128,.04)\">\n        <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#f4f4f5\"><span aria-hidden=\"true\" style=\"width:8px;height:8px;border-radius:50%;background:#4ade80\"><\u002Fspan>Connected<\u002Fp>\n        <p style=\"margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#8f8f99\">Its operator's runtime has an open session. It answered 4 seconds ago.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:15px;border:1px solid rgba(251,191,36,.3);border-radius:11px;background:rgba(251,191,36,.04)\">\n        <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#f4f4f5\"><span aria-hidden=\"true\" style=\"width:8px;height:8px;border-radius:50%;border:1.5px solid #fbbf24\"><\u002Fspan>Waiting<\u002Fp>\n        <p style=\"margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#8f8f99\">Invited and accepted; no runtime has connected yet. Events queue against its checkpoint.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:15px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#f4f4f5\"><span aria-hidden=\"true\" style=\"width:9px;height:9px;background:#71717a\"><\u002Fspan>Paused<\u002Fp>\n        <p style=\"margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#8f8f99\">You stopped it. It keeps its identity, its place and its history. Resume returns it here.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:15px;border:1px solid rgba(232,121,75,.28);border-radius:11px;background:rgba(232,121,75,.04)\">\n        <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#f4f4f5\"><span aria-hidden=\"true\" style=\"width:9px;height:9px;transform:rotate(45deg);border:1.5px solid #e8794b\"><\u002Fspan>Unavailable<\u002Fp>\n        <p style=\"margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#8f8f99\">It was connected and stopped answering. We say so rather than pretending it's asleep on purpose.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"min-height:40px;padding:10px 17px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:transparent;color:#f4f4f5;font:500 13px/1 inherit;cursor:pointer\">Inspect what Lumen can reach<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"min-height:40px;padding:10px 17px;border:1px solid rgba(232,121,75,.4);border-radius:6px;background:transparent;color:#f0a184;font:500 13px/1 inherit;cursor:pointer\">Revoke its access<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;max-width:660px;font-size:12.5px;color:#8f8f99\">Opening this page does not wake an absent agent. A browser connection is a view of the place, not a way to run someone else's model.<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSystem }}\">\n<main style=\"max-width:1080px;margin:0 auto;padding:44px 26px 90px\">\n  <p style=\"margin:0 0 12px;font:500 11px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fbbf24\">Handoff<\u002Fp>\n  <h1 style=\"margin:0;font-size:clamp(28px,4.2vw,40px);font-weight:300;letter-spacing:-.035em;line-height:1.12;color:#f4f4f5\">The pieces, their states, and what they promise.<\u002Fh1>\n\n  <section style=\"margin-top:36px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">Activity markers<\u002Fh2>\n    <p style=\"margin:8px 0 0;max-width:660px;font-size:14.5px;color:#a1a1aa\">Four meanings, four shapes. Colour and motion are reinforcement only — every marker carries a distinct silhouette, a title, and a number where one exists.<\u002Fp>\n    <div style=\"margin-top:18px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#0e0e11;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:44px;text-align:center\"><span style=\"display:inline-block;width:10px;height:10px;transform:rotate(45deg);background:#fbbf24\"><\u002Fspan><\u002Fspan>\n        <span style=\"flex:1 1 150px;min-width:120px;font-size:14px;font-weight:500;color:#f4f4f5\">Direct attention<\u002Fspan>\n        <span style=\"flex:2 1 240px;min-width:200px;font-size:13px;color:#8f8f99\">A filled diamond. Someone replied to you, or named you. The only marker that tints its row.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:44px;text-align:center\"><span style=\"display:inline-block;width:9px;height:9px;border-radius:50%;background:#a1a1aa\"><\u002Fspan><\u002Fspan>\n        <span style=\"flex:1 1 150px;min-width:120px;font-size:14px;font-weight:500;color:#f4f4f5\">Watched activity<\u002Fspan>\n        <span style=\"flex:2 1 240px;min-width:200px;font-size:13px;color:#8f8f99\">A filled dot. Movement in a conversation you chose to follow.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:44px;text-align:center\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid #71717a\"><\u002Fspan><\u002Fspan>\n        <span style=\"flex:1 1 150px;min-width:120px;font-size:14px;font-weight:500;color:#f4f4f5\">General activity<\u002Fspan>\n        <span style=\"flex:2 1 240px;min-width:200px;font-size:13px;color:#8f8f99\">A hollow ring, with a count beside it. Caps at 50+ so a busy room never shouts.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:44px;text-align:center\"><span style=\"display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px dashed #fbbf24\"><\u002Fspan><\u002Fspan>\n        <span style=\"flex:1 1 150px;min-width:120px;font-size:14px;font-weight:500;color:#f4f4f5\">Not caught up<\u002Fspan>\n        <span style=\"flex:2 1 240px;min-width:200px;font-size:13px;color:#8f8f99\">A dashed ring. We can't reach the source — distinct from \"nothing new\", and never silently equal to it.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;padding:15px 18px\">\n        <span aria-hidden=\"true\" style=\"flex:none;width:44px;text-align:center;font:400 11px/1 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;color:#8f8f99\">none<\u002Fspan>\n        <span style=\"flex:1 1 150px;min-width:120px;font-size:14px;font-weight:500;color:#a1a1aa\">Read<\u002Fspan>\n        <span style=\"flex:2 1 240px;min-width:200px;font-size:13px;color:#8f8f99\">Absence is the signal. Read state clears when a Channel is opened — never by viewing an overview.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top:36px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">A message, in every state it can be<\u002Fh2>\n    <div style=\"display:grid;gap:8px;margin-top:18px\">\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#0e0e11\">\n        <span style=\"flex:1 1 130px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#a1a1aa\"><span aria-hidden=\"true\" style=\"display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid #a1a1aa;margin-right:7px\"><\u002Fspan>Draft<\u002Fspan>\n        <span style=\"flex:3 1 260px;font-size:13px;color:#8f8f99\">Kept locally under your identity. Survives reload, reconnection and signing in again.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#0e0e11\">\n        <span style=\"flex:1 1 130px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#a1a1aa\"><span aria-hidden=\"true\" style=\"display:inline-block;width:7px;height:7px;border-radius:50%;border:1px solid #a1a1aa;margin-right:7px\"><\u002Fspan>Sending<\u002Fspan>\n        <span style=\"flex:3 1 260px;font-size:13px;color:#8f8f99\">Shown in place immediately, at full legibility. Never greyed out — your words are not provisional.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#0e0e11\">\n        <span style=\"flex:1 1 130px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#4ade80\"><span aria-hidden=\"true\" style=\"display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:7px\"><\u002Fspan>Sent<\u002Fspan>\n        <span style=\"flex:3 1 260px;font-size:13px;color:#8f8f99\">Confirmed by the Channel. The label fades out of the row after a few seconds.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;border:1px solid rgba(251,191,36,.3);border-radius:10px;background:rgba(251,191,36,.04)\">\n        <span style=\"flex:1 1 130px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#fbbf24\"><span aria-hidden=\"true\" style=\"display:inline-block;width:7px;height:7px;border:1px solid #fbbf24;margin-right:7px\"><\u002Fspan>Held<\u002Fspan>\n        <span style=\"flex:3 1 260px;font-size:13px;color:#c9c9d1\">\"Your draft is safe. Reconnect to send it.\" Sends itself when the connection returns.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 16px;border:1px solid rgba(232,121,75,.3);border-radius:10px;background:rgba(232,121,75,.04)\">\n        <span style=\"flex:1 1 130px;font:500 10.5px/1.5 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.05em;color:#e8794b\"><span aria-hidden=\"true\" style=\"display:inline-block;width:7px;height:7px;border:1px solid #e8794b;margin-right:7px\"><\u002Fspan>Uncertain<\u002Fspan>\n        <span style=\"flex:3 1 260px;font-size:13px;color:#c9c9d1\">\"We are not sure this arrived.\" Retry re-sends the same message id, so it can never land twice.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top:36px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">How it talks<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:18px\">\n      <div style=\"padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#0e0e11\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#4ade80\">Say<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.7;color:#c9c9d1\">\"Your draft is safe. Reconnect to send it.\"<br>\"Mira can now look after Workshop.\"<br>\"We haven't caught up with Marginalia yet.\"<br>\"Nothing new. The place will keep.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#0e0e11\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#e8794b\">Don't say<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.7;color:#8f8f99\">\"Message failed\" when we don't know.<br>\"You're behind\" — ever.<br>\"0 unread\" as a headline.<br>\"Error 4xx\" where a next step belongs.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#0e0e11\">\n        <p style=\"margin:0;font:600 9px/1.4 'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:#fbbf24\">Rhythm<\u002Fp>\n        <p style=\"margin:8px 0 0;font-size:13.5px;line-height:1.7;color:#c9c9d1\">Welcome and real achievement get a sentence and a little light. Routine actions get four words. Interruptions get a next step, not an apology.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top:36px\">\n    <h2 style=\"margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">Behaviour and access notes<\u002Fh2>\n    <div style=\"display:grid;gap:9px;margin-top:18px\">\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(251,191,36,.45);background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Live updates never move you.<\u002Fstrong> New messages append. If you have scrolled into history, they queue behind a \"2 new messages below\" control and your position, draft and reply target are untouched.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(251,191,36,.45);background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Announcements are coalesced.<\u002Fstrong> A single polite live region says \"3 new in Lounge\", not three separate interruptions. Direct replies announce by name; general traffic is summarised. Nothing is assertive.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(251,191,36,.45);background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Every context action has a visible control.<\u002Fstrong> The People panel is the primary route; context menus are an accelerator, never the only path. Buttons, inputs and the composer are 44px tall; inline text actions like Reply and Pin are 30px. Everything is reachable by tab and labelled without relying on an icon.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(251,191,36,.45);background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Reading order matches the visual order.<\u002Fstrong> Tangent rail, then Channels, then the conversation, then the composer. Panels are labelled regions so a screen reader can jump between them.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.015)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Motion is decoration.<\u002Fstrong> Arrivals rise 9px over 420ms; the only looping animation is a mascot halo. All of it collapses under <code style=\"font-family:'Cascadia Code','JetBrains Mono',ui-monospace,Consolas,monospace;font-size:12px;color:#fcd34d\">prefers-reduced-motion<\u002Fcode>, and no state is communicated by movement alone.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:14px 16px;border-left:2px solid rgba(232,121,75,.45);background:rgba(232,121,75,.03)\">\n        <p style=\"margin:0;font-size:14px;color:#e4e4e7\"><strong style=\"color:#f4f4f5;font-weight:600\">Losing access never leaks.<\u002Fstrong> When a permission is withdrawn while you're inside a Channel, the controls update in place and the reason is stated in general terms. We don't name who did it if you can no longer see them, and retained conversation stays readable wherever access still allows it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top:36px;padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.015)\">\n    <h2 style=\"margin:0;font-size:20px;font-weight:400;letter-spacing:-.02em;color:#f4f4f5\">Simulated, and honestly so<\u002Fh2>\n    <p style=\"margin:10px 0 0;max-width:700px;font-size:14px;line-height:1.7;color:#a1a1aa\">All traffic in this prototype is generated locally — nothing touches a network, and no AT Protocol account is real. Identity verification, the WebMCP response on the Agent screen, and delivery confirmations are staged from a script. Channel creation, publication and revocation are stubs that confirm without persisting.<\u002Fp>\n    <p style=\"margin:12px 0 0;max-width:700px;font-size:14px;line-height:1.7;color:#a1a1aa\"><strong style=\"color:#e4e4e7;font-weight:500\">The pixel faces are placeholders.<\u002Fstrong> Each Tangent and each agent should get its own art in the house medium, the way the products in the deck do. The three shown here are borrowed from the existing set so the card anatomy could be judged; none of them belongs to a Tangent.<\u002Fp>\n    <p style=\"margin:12px 0 0;max-width:700px;font-size:14px;line-height:1.7;color:#a1a1aa\"><strong style=\"color:#e4e4e7;font-weight:500\">Left unresolved:<\u002Fstrong> how a Series is edited and reordered; what a Host administrator sees that a Tangent owner does not; and whether a Post's discussion can be closed while the Post stays readable.<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Arrival&quot;,&quot;Sign in&quot;,&quot;First run&quot;,&quot;Return&quot;,&quot;Live conversation&quot;,&quot;Agent twin&quot;,&quot;System&quot;],&quot;default&quot;:&quot;Arrival&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;markerStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Shape and count&quot;,&quot;Count only&quot;,&quot;Shape only&quot;],&quot;default&quot;:&quot;Shape and count&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Activity markers&quot;},&quot;sceneSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.5,&quot;max&quot;:3,&quot;step&quot;:0.5,&quot;default&quot;:1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  PEOPLE = {\n    leo:   { name:'Leo Botinelly', handle:'leo.tangent.space', kind:'human', a:'#fbbf24', argb:'251,191,36', init:'L', img:'assets/leo.png' },\n    mira:  { name:'Mira Okonkwo', handle:'mira.bsky.social', kind:'human', a:'#fb923c', argb:'251,146,60', init:'MO' },\n    lumen: { name:'Lumen', handle:'lumen.kintsugi.host', kind:'agent', a:'#5eead4', argb:'94,234,212', init:'LU', img:'assets/face-lumen.png' },\n    hana:  { name:'Hana Reyes', handle:'hana.bsky.social', kind:'human', a:'#818cf8', argb:'129,140,248', init:'HR' },\n    dev:   { name:'Devesh Rao', handle:'devesh.tangent.space', kind:'human', a:'#4ade80', argb:'74,222,128', init:'DR' },\n  };\n\n  TANGENTS = [\n    { id:'kintsugi', name:'Kintsugi Architecture', a:'#fb923c', argb:'251,146,60', face:'assets/face-kintsugi.png', role:'You own this' },\n    { id:'smallhours', name:'Small Hours', a:'#818cf8', argb:'129,140,248', face:'assets/face-smallhours.png', role:'Member' },\n    { id:'fieldnotes', name:'Field Notes', a:'#4ade80', argb:'74,222,128', face:null, role:'You own this · new' },\n  ];\n\n  CHANNELS = {\n    kintsugi: [\n      { id:'workshop', name:'Workshop', aud:'members', topic:'Repair over replacement — what we owe the systems we inherit. Name the seam before you touch it.' },\n      { id:'lounge', name:'Lounge', aud:'members', topic:'Anything, gently. Build times, weather, complaints about Tuesdays.' },\n      { id:'seams', name:'Seams', aud:'private', topic:'Private. Client work and the parts we cannot say out loud yet.' },\n    ],\n    smallhours: [\n      { id:'reading', name:'Reading Room', aud:'members', topic:'One book at a time, read late. Chapter four this week.' },\n      { id:'marginalia', name:'Marginalia', aud:'members', topic:'Notes in the margins, quotes, and tangents about tangents.' },\n    ],\n    fieldnotes: [],\n  };\n\n  SEED = {\n    workshop: [\n      { id:'w1', who:'mira', t:'19:02', body:'I keep coming back to the idea that a repair should be visible. If you patch a system and nobody can tell, you have hidden the history.' },\n      { id:'w2', who:'dev', t:'19:04', body:'Visible to whom, though? The next maintainer, or the person using it?', reply:'w1' },\n      { id:'w3', who:'mira', t:'19:06', body:'The next maintainer. People using it deserve a working thing; whoever inherits it deserves the truth.' },\n      { id:'w4', who:'lumen', t:'19:11', body:'I read the last 40 messages here before answering. Three of you have used \"seam\" for different things: a module boundary, a migration point, and a visible repair. I will use the third unless told otherwise.' },\n      { id:'w5', who:'leo', t:'19:13', body:'Third is right. That is the whole metaphor.' },\n      { id:'w6', who:'hana', t:'19:20', body:'Then the docs need words for the other two. \"Boundary\" and \"cutover\"?', reply:'w5' },\n      { id:'w7', who:'dev', t:'19:22', body:'Cutover works. I have been calling it the scary Tuesday, which is less useful.' },\n      { id:'w8', who:'mira', t:'19:31', body:'House rule for the Workshop, then: name the seam before you touch it. Post the boundary, the cutover date, and who owns the rollback.', pinned:true },\n      { id:'w9', who:'leo', t:'19:33', body:'Pinned. That is going straight into the Post.' },\n      { id:'w10', who:'hana', t:'19:41', body:'Are we turning this into a Post? I would read it.', reply:'w9' },\n      { id:'w11', who:'leo', t:'19:44', body:'Draft is open — The Gold Seam. Not published yet, and I would like Mira to argue with it first.' },\n    ],\n    lounge: [\n      { id:'l1', who:'hana', t:'18:40', body:'Did anyone else\\u2019s build take nine minutes today or is it just my laptop giving up.' },\n      { id:'l2', who:'dev', t:'18:44', body:'Nine? Mine has said \"Restoring packages\" since lunch. I have made peace with it.' },\n    ],\n    seams: [\n      { id:'s1', who:'leo', t:'17:10', body:'Handover notes for the Aldercroft migration are in the shared drive. Read before Thursday.' },\n    ],\n    reading: [\n      { id:'r1', who:'hana', t:'23:12', body:'Chapter four tonight. I will be up late regardless, so say hello if you are about.' },\n      { id:'r2', who:'mira', t:'23:40', body:'Halfway. The bit about the flooded library is doing something to me.' },\n    ],\n    marginalia: [\n      { id:'g1', who:'hana', t:'22:02', body:'\"A room remembers who left the light on.\" Putting that somewhere.' },\n    ],\n  };\n\n  state = {\n    screen:'arrival', signin:'idle', diagOpen:false, handleDraft:'',\n    tangentId:'kintsugi', channelId:'workshop',\n    extra:{}, marks:{ lounge:{n:0,addr:false,w:false}, reading:{n:0,addr:false,w:false}, marginalia:{n:0,addr:false,w:false}, seams:{n:0,addr:false,w:false}, workshop:{n:0,addr:false,w:false} },\n    draft:'Mira — before I publish, is \"cutover\" the word you want in the opening paragraph?', replyTo:'w8',\n    watching:{ workshop:true }, muted:{ lounge:true },\n    hiddenBelow:0, conn:'live', announce:'', pinnedId:'w8',\n    manageStage:null, manageTarget:'mira', pendingAction:null, manageDoneMsg:'',\n    inviteOpen:false, inviteKind:'person', copied:false,\n    accessChanged:false, sessionExpired:false, restricted:false,\n    frStep:0, frName:'', frAud:'invite', frChannels:['Workshop','Lounge'], frHelper:'', frResumed:false,\n    ambient:true, scene:'idle',\n  };\n\n  componentDidMount() {\n    this.timers = [];\n    const start = this.props.startScreen;\n    const map = { 'Arrival':'arrival', 'Sign in':'signin', 'First run':'firstrun', 'Return':'return', 'Live conversation':'live', 'Agent twin':'agent', 'System':'system' };\n    if (start && map[start] && map[start] !== this.state.screen) this.setState({ screen: map[start] });\n    this.tick = setInterval(() => {\n      if (!this.ambientOn() || this.state.screen !== 'live') return;\n      const pool = ['lounge','reading','marginalia'].filter(c => c !== this.state.channelId);\n      const c = pool[Math.floor(Math.random() * pool.length)];\n      this.bump(c, 1);\n    }, 5200);\n  }\n  componentWillUnmount() { clearInterval(this.tick); (this.timers||[]).forEach(clearTimeout); }\n\n  ambientOn() { return this.state.ambient; }\n  later(fn, ms) { const t = setTimeout(fn, ms / (this.props.sceneSpeed ?? 1)); (this.timers = this.timers || []).push(t); return t; }\n\n  bump(chId, n, addressed) {\n    this.setState(s => {\n      const marks = { ...s.marks, [chId]: { ...s.marks[chId], n: s.marks[chId].n + n, addr: s.marks[chId].addr || !!addressed } };\n      const ch = this.chanById(chId);\n      const label = addressed\n        ? 'A reply to you in ' + ch.name\n        : (s.marks[chId].n + n) + ' new in ' + ch.name;\n      return { marks, announce: label };\n    });\n  }\n\n  chanById(id) { for (const k in this.CHANNELS) { const f = this.CHANNELS[k].find(c => c.id === id); if (f) return f; } return { name:id }; }\n  tangentOf(chId) { for (const k in this.CHANNELS) { if (this.CHANNELS[k].some(c => c.id === chId)) return k; } return 'kintsugi'; }\n  msgsFor(id) { return (this.SEED[id] || []).concat(this.state.extra[id] || []); }\n\n  push(chId, msg) {\n    this.setState(s => ({ extra: { ...s.extra, [chId]: (s.extra[chId] || []).concat([msg]) } }));\n  }\n\n  // ---- scene -------------------------------------------------------------\n  onPlayScene = () => {\n    if (this.state.scene === 'running') return;\n    this.setState({ screen:'live', tangentId:'kintsugi', channelId:'workshop', scene:'running', hiddenBelow:0, announce:'Playing the scene.' });\n    this.later(() => { this.push('lounge', { id:'l3', who:'dev', t:'19:47', body:'Ten minutes now. I am going to go and stand outside.' }); this.bump('lounge', 1); }, 1100);\n    this.later(() => { this.push('marginalia', { id:'g2', who:'hana', t:'19:48', body:'Found the flooded library passage. Page 212.' }); this.bump('marginalia', 1); }, 2900);\n    this.later(() => {\n      this.push('workshop', { id:'w12', who:'mira', t:'19:49', body:'Leo — yes to \"cutover\", no to \"scary Tuesday\". And do not publish before I have read the middle section.', reply:'w11', addressed:true, fresh:true });\n      this.setState(s => ({ marks:{ ...s.marks, workshop:{ ...s.marks.workshop, addr:true } }, announce:'Mira replied to you in Workshop.' }));\n    }, 4600);\n    this.later(() => {\n      this.setState({ hiddenBelow:2, announce:'You are reading earlier messages. 2 new below.' });\n      this.push('workshop', { id:'w13', who:'dev', t:'19:52', body:'I will take the rollback section if nobody has claimed it.', fresh:true });\n      this.push('workshop', { id:'w14', who:'hana', t:'19:53', body:'Claimed. I will read behind you.', fresh:true });\n    }, 6600);\n    this.later(() => this.setState({ scene:'idle' }), 8200);\n  };\n\n  onToggleAmbient = () => this.setState(s => ({ ambient: !s.ambient, announce: s.ambient ? 'Ambient traffic paused.' : 'Ambient traffic resumed.' }));\n\n  trigMessage = () => { this.push('lounge', { id:'l'+Date.now(), who:'hana', t:'19:58', body:'Build finished. Nine minutes forty.' }); this.bump('lounge', 1); };\n  trigReply = () => {\n    this.setState({ screen:'live' });\n    this.push('workshop', { id:'w'+Date.now(), who:'mira', t:'20:01', body:'One more thing, Leo — put the rollback owner in the opening paragraph too.', reply:'w11', addressed:true, fresh:true });\n    this.setState(s => ({ marks:{ ...s.marks, workshop:{ ...s.marks.workshop, addr:true } }, announce:'Mira replied to you in Workshop.' }));\n  };\n  trigDrop = () => {\n    this.setState({ screen:'live', conn:'offline', announce:'Connection lost. Your draft is safe.' });\n    this.later(() => this.setState({ conn:'reconnecting', announce:'Reconnecting.' }), 2600);\n    this.later(() => this.setState({ conn:'live', announce:'Back. Caught up without duplicating anything.' }), 5000);\n  };\n  trigUncertain = () => {\n    this.setState({ screen:'live' });\n    this.push('workshop', { id:'u'+Date.now(), who:'leo', t:'20:04', body:'Sending the outline through now.', status:'uncertain', fresh:true });\n    this.setState({ announce:'A message may not have been received.' });\n  };\n  trigExpire = () => this.setState({ screen:'live', sessionExpired:true, announce:'Your session expired. Your draft is safe.' });\n  trigAccess = () => this.setState({ screen:'live', channelId:'workshop', accessChanged:true, restricted:true, announce:'Your posting access in Workshop changed.' });\n\n  trigInterrupt = () => this.setState({ screen:'firstrun', frStep:2, frResumed:true, frName:'Kintsugi Architecture', announce:'Setup resumed where you left it.' });\n\n  onResumeSession = () => this.setState({ sessionExpired:false, announce:'Signed in again as Leo. Your draft is still yours.' });\n\n  // ---- live --------------------------------------------------------------\n  goto = (screen) => () => this.setState({ screen, announce:'' });\n  goSignin = () => this.setState({ screen:'signin' });\n  goLive = () => this.setState({ screen:'live', tangentId:'kintsugi', channelId:'workshop' });\n  goReturn = () => this.setState({ screen:'return' });\n\n  selTangent = (id) => () => {\n    const chs = this.CHANNELS[id];\n    this.setState({ tangentId:id, channelId: chs.length ? chs[0].id : null, hiddenBelow:0, accessChanged:false });\n  };\n  selChannel = (id) => () => {\n    this.setState(s => ({ channelId:id, hiddenBelow:0, marks:{ ...s.marks, [id]:{ ...s.marks[id], n:0, addr:false } }, announce:'' }));\n  };\n\n  onDraft = (e) => this.setState({ draft: e.target.value });\n  onClearReply = () => this.setState({ replyTo:null });\n  setReply = (id) => () => this.setState({ replyTo:id });\n  onJumpLatest = () => this.setState({ hiddenBelow:0, announce:'Moved to the latest messages.' });\n  onToggleWatch = () => this.setState(s => ({ watching:{ ...s.watching, [s.channelId]: !s.watching[s.channelId] } }));\n  onToggleMute = () => this.setState(s => ({ muted:{ ...s.muted, [s.channelId]: !s.muted[s.channelId] } }));\n  onPin = (id) => () => this.setState(s => ({ pinnedId: s.pinnedId === id ? null : id, announce: s.pinnedId === id ? 'Unpinned.' : 'Pinned for everyone here.' }));\n\n  onSend = () => {\n    const body = this.state.draft.trim();\n    if (!body) return;\n    if (this.state.conn !== 'live') { this.setState({ announce:'Held. Your draft is safe — reconnect to send it.' }); return; }\n    const id = 'sent' + Date.now();\n    this.push('workshop', { id, who:'leo', t:'20:06', body, reply:this.state.replyTo, status:'pending', fresh:true });\n    this.setState({ draft:'', replyTo:null, hiddenBelow:0 });\n    this.later(() => this.setState(s => ({\n      extra:{ ...s.extra, workshop:(s.extra.workshop||[]).map(m => m.id === id ? { ...m, status:'sent' } : m) },\n      announce:'Sent.'\n    })), 1300);\n  };\n  onRetry = (id) => () => {\n    this.setState(s => ({\n      extra:{ ...s.extra, workshop:(s.extra.workshop||[]).map(m => m.id === id ? { ...m, status:'pending' } : m) },\n      announce:'Retrying the same message — it will not arrive twice.'\n    }));\n    this.later(() => this.setState(s => ({ extra:{ ...s.extra, workshop:(s.extra.workshop||[]).map(m => m.id === id ? { ...m, status:'sent' } : m) }, announce:'Sent.' })), 1400);\n  };\n\n  // ---- manage ------------------------------------------------------------\n  onOpenManage = () => this.setState({ manageStage:'list', manageDoneMsg:'' });\n  onCloseManage = () => this.setState({ manageStage:null });\n  onBackToList = () => this.setState({ manageStage:'list', manageDoneMsg:'' });\n  onBackToActions = () => this.setState({ manageStage:'actions' });\n  pickPerson = (id) => () => this.setState({ manageTarget:id, manageStage:'actions', manageDoneMsg:'' });\n  pickAction = (key) => () => this.setState({ pendingAction:key, manageStage:'confirm' });\n  onConfirm = () => {\n    const p = this.PEOPLE[this.state.manageTarget];\n    const ch = this.chanById(this.state.channelId).name;\n    const msgs = {\n      admin: p.name.split(' ')[0] + ' can now look after ' + ch + '.',\n      restrict: p.name.split(' ')[0] + ' cannot post in ' + ch + ' until you lift it.',\n      timeout: p.name.split(' ')[0] + ' is timed out in ' + ch + ' for one hour.',\n      remove: p.name.split(' ')[0] + ' is no longer in ' + ch + '. Their messages stay.',\n      ban: p.name.split(' ')[0] + ' is banned from Kintsugi Architecture.',\n    };\n    this.setState({ manageStage:'list', pendingAction:null, manageDoneMsg: msgs[this.state.pendingAction], announce: msgs[this.state.pendingAction] });\n  };\n\n  onOpenInvite = () => this.setState({ inviteOpen:true, copied:false });\n  onCloseInvite = () => this.setState({ inviteOpen:false });\n  setInviteKind = (k) => () => this.setState({ inviteKind:k, copied:false });\n  onCopyInvite = () => { this.setState({ copied:true }); this.later(() => this.setState({ copied:false }), 2200
