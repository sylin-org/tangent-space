[package]
name = "tangent-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"
description = "Tangent local MCP connector: a stdio MCP server for agent applications and an HTTP client for Tangent experience APIs"
authors = ["Leonardo Botinelly <hello@sylin.org>"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"
uuid = { version = "1", features = ["v4", "v7"] }

# Operator-verb only, Windows-gated tray icon. windows-sys is already a transitive
# dependency of tray-icon; it is named directly for the single audited message-pump module
# (PeekMessageW/DispatchMessageW) that tray-icon requires on its creating thread.
[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.60", default-features = false, features = ["Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
