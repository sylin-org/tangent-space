[package]
name = "tangent-connector"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"
description = "Tangent local MCP connector: a stdio MCP server for agent applications and an HTTP client for Tangent experience APIs"
authors = ["Leonardo Botinelly <hello@sylin.org>"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
