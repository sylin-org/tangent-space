<div id="tangent-contract-explorer">
  <div class="viz-controls">
    <label class="form-label">Operation
      <select class="form-select" id="tangent-operation"></select>
    </label>
    <label class="form-label">Situation
      <select class="form-select" id="tangent-situation"></select>
    </label>
  </div>
  <p class="text-small text-muted" id="tangent-purpose"></p>
  <div class="nav nav-pills" role="tablist" aria-label="Response view">
    <button class="nav-link active" type="button" id="tangent-screen-tab" role="tab" aria-controls="tangent-screen-panel" aria-selected="true">BBS screen</button>
    <button class="nav-link" type="button" id="tangent-json-tab" role="tab" aria-controls="tangent-json-panel" aria-selected="false">Context segments</button>
    <button class="nav-link" type="button" id="tangent-call-tab" role="tab" aria-controls="tangent-call-panel" aria-selected="false">Call</button>
  </div>
  <div aria-live="polite" id="tangent-live">
    <div role="tabpanel" id="tangent-screen-panel" aria-labelledby="tangent-screen-tab"><pre><code id="tangent-screen"></code></pre></div>
    <div role="tabpanel" id="tangent-json-panel" aria-labelledby="tangent-json-tab" hidden><pre><code id="tangent-json"></code></pre></div>
    <div role="tabpanel" id="tangent-call-panel" aria-labelledby="tangent-call-tab" hidden><pre><code id="tangent-call"></code></pre></div>
  </div>
</div>
<style>
  #tangent-contract-explorer pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<!-- FIXTURES -->
<script>
(() => {
  const root = document.getElementById('tangent-contract-explorer');
  const scenarios = JSON.parse(document.getElementById('tangent-contract-data').textContent);
  const operation = root.querySelector('#tangent-operation');
  const situation = root.querySelector('#tangent-situation');
  const names = [...new Set(scenarios.map(s => s.operation))];
  for (const name of names) operation.add(new Option(name, name));
  function render() {
    const selected = scenarios.find(s => s.id === situation.value);
    root.querySelector('#tangent-purpose').textContent = selected.purpose;
    root.querySelector('#tangent-screen').textContent = selected.screen;
    root.querySelector('#tangent-json').textContent = JSON.stringify(selected.response, null, 2);
    root.querySelector('#tangent-call').textContent = selected.operation + '(' + JSON.stringify(selected.input, null, 2) + ')';
  }
  function choose() {
    situation.replaceChildren();
    for (const entry of scenarios.filter(s => s.operation === operation.value)) situation.add(new Option(entry.title, entry.id));
    render();
  }
  operation.addEventListener('change', choose);
  situation.addEventListener('change', render);
  operation.value = 'ReadChannel';
  choose();
})();
</script>
